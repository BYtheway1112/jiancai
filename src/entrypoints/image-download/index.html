<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简采 · 保存图文</title>
  <style>
    :root { color: #26364a; background: #f6f8fc; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; }
    main { box-sizing: border-box; width: min(720px, 100%); margin: 0 auto; padding: 42px 28px 56px; }
    h1 { margin: 0 0 8px; font-size: 25px; letter-spacing: .02em; }
    .summary { margin: 0 0 24px; color: #6b7f9a; }
    .card { padding: 20px; background: #fff; border: 1px solid #e3eaf4; border-radius: 14px; box-shadow: 0 8px 32px #38557d12; }
    button { padding: 10px 18px; border: 0; border-radius: 9px; background: #0c7bf4; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .hint { margin: 12px 0 0; color: #7c8ea7; font-size: 13px; }
    .status { min-height: 28px; margin-top: 18px; white-space: pre-wrap; }
    .status.error { color: #a44e3e; }
    .files { margin: 18px 0 0; padding-left: 25px; color: #657995; }
    .files li { padding: 3px 0; }
    .files li.success { color: #26764d; }
    .files li.failed { color: #a44e3e; }
    .files li.saving { color: #275e9f; }
    .files small { color: inherit; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>保存图文</h1>
    <p id="summary" class="summary">正在读取作品下载任务…</p>
    <section class="card">
      <button id="save" type="button">选择文件夹并保存</button>
      <p class="hint">首次点击时选择一个本地目录；简采会在其中创建作品文件夹，并按顺序保存图片。</p>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <ol id="files" class="files"></ol>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
